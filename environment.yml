name: llm_jam
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.3
  - pytorch-cuda=12.1
  - cudatoolkit=12.1
  - numpy>=1.26
  - scipy
  - pandas
  - tqdm
  - pip:
    - transformers>=4.44
    - sentence-transformers>=3.4
    - faiss-gpu-cu12
    - vllm>=0.5.3
    - datasets>=3.2
    - omegaconf>=2.3
    - hydra-core>=1.3
    - accelerate
    - beir
    - nltk
    - pytest
    - pytest-mock
