[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm_jam"
version = "0.1.0"
requires-python = ">=3.10"
description = "Universal blocker documents for RAG jamming — extends Shafran et al. 2025"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy",
    "pandas",
    "tqdm",
    "transformers>=4.44",
    "sentence-transformers>=3.4",
    "faiss-gpu-cu12",
    "vllm>=0.5.3",
    "datasets>=3.2",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "accelerate",
    "beir",
    "nltk",
    "pytest",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
